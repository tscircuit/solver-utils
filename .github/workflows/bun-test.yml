# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Setup Node for packed consumer checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build package
        run: bun run build

      - name: Check packed Bun, Node, and browser consumers
        run: bun scripts/check-runtime-packaging.ts

      - name: Check React entrypoint uses consumer React
        run: bun scripts/check-react-packaging.tsx
